<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Company Mods</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
        }

        /* ========================================
           PAGE PRINCIPALE
        ======================================== */

        .hero {
            position: relative;
            width: 100%;
            height: 100vh;

            background-image: url("accueil.png");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }


        /* ========================================
           ASSOMBRISSEMENT GÉNÉRAL
        ======================================== */

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,0.15),
                    rgba(0,0,0,0.20) 50%,
                    rgba(0,0,0,0.65) 100%
                );

            z-index: 1;
        }


        /* ========================================
           LUMIÈRE CENTRALE
        ======================================== */

        .hero::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 40%;

            width: 70%;
            height: 55%;

            transform: translate(-50%, -50%);

            background:
                radial-gradient(
                    ellipse,
                    rgba(255,255,255,0.28) 0%,
                    rgba(255,255,255,0.12) 30%,
                    rgba(255,255,255,0.04) 52%,
                    rgba(255,255,255,0) 75%
                );

            z-index: 2;

            pointer-events: none;
        }


        /* ========================================
           LOGO EN HAUT À GAUCHE
        ======================================== */

        .site-header {
            position: absolute;

            top: 25px;
            left: 30px;

            z-index: 20;
        }

        .logo-link {
            display: block;
        }

        .site-logo {
            width: 105px;
            height: auto;

            display: block;

            transition:
                transform 0.3s ease,
                opacity 0.3s ease;
        }

        .logo-link:hover .site-logo {
            transform: scale(1.05);
            opacity: 0.85;
        }


        /* ========================================
           CONTENU CENTRAL
        ======================================== */

        .hero-content {
            position: relative;

            z-index: 5;

            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;

            padding-top: 20px;
        }


        /* ========================================
           LOGO CENTRAL
        ======================================== */

        .center-logo {
            width: min(330px, 38vw);
            height: auto;

            margin-bottom: 55px;

            filter:
                drop-shadow(0 4px 12px rgba(255,255,255,0.18))
                drop-shadow(0 8px 25px rgba(0,0,0,0.65));

            opacity: 0.96;
        }


        /* ========================================
           BOUTONS
        ======================================== */

        .buttons {
            display: flex;

            flex-direction: column;
            align-items: center;

            gap: 15px;

            width: 100%;
        }

        .hero-button {

            display: flex;

            align-items: center;
            justify-content: center;

            height: 58px;
            min-width: 245px;

            padding: 0 30px;

            border: 1px solid rgba(255,255,255,0.65);

            background: rgba(5,5,5,0.82);

            color: #ffffff;

            text-decoration: none;

            font-size: 12px;
            font-weight: bold;

            letter-spacing: 2.5px;

            transition:
                background 0.3s ease,
                border 0.3s ease,
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }


        /* ========================================
           EFFET AU SURVOL
        ======================================== */

        .hero-button:hover {

            background: #d51f3f;

            border-color: #d51f3f;

            transform: translateY(-3px);

            box-shadow:
                0 8px 25px rgba(0,0,0,0.45);
        }


        /* ========================================
           INSTAGRAM
        ======================================== */

        .instagram {

            margin-top: 28px;

            color: rgba(255,255,255,0.75);

            text-decoration: none;

            font-size: 12px;

            letter-spacing: 2px;

            transition:
                color 0.3s ease,
                transform 0.3s ease;
        }

        .instagram:hover {

            color: #d51f3f;

            transform: translateY(-2px);
        }


        /* ========================================
           VERSION MOBILE
        ======================================== */

        @media (max-width: 700px) {

            .site-header {
                top: 18px;
                left: 18px;
            }

            .site-logo {
                width: 80px;
            }

            .center-logo {
                width: 240px;

                margin-bottom: 40px;
            }

            .hero-button {
                min-width: 210px;
                height: 52px;

                font-size: 10px;
            }

            .buttons {
                gap: 12px;
            }

            .instagram {
                margin-top: 22px;
            }
        }

    </style>
</head>


<body>


    <!-- ========================================
         PAGE D'ACCUEIL
    ======================================== -->

    <main class="hero">


        <!-- ====================================
             LOGO EN HAUT À GAUCHE
        ===================================== -->

        <header class="site-header">

            <a href="index.html" class="logo-link">

                <img
                    src="logo.png"
                    alt="Company Mods"
                    class="site-logo"
                >

            </a>

        </header>



        <!-- ====================================
             CONTENU CENTRAL
        ===================================== -->

        <div class="hero-content">


            <!-- LOGO COMPANY MODS AU CENTRE -->

            <img
                src="logo.png"
                alt="Company Mods"
                class="center-logo"
            >



            <!-- =================================
                 LES TROIS BOUTONS
            ================================== -->

            <div class="buttons">


                <!-- PERSONNALISER -->

                <a
                    href="personnaliser.html"
                    class="hero-button"
                >
                    PERSONNALISER UN MODÈLE
                </a>


                <!-- MODE D'EMPLOI -->

                <a
                    href="mode-emploi.html"
                    class="hero-button"
                >
                    MODE D'EMPLOI
                </a>


                <!-- CONTACT -->

                <a
                    href="contact.html"
                    class="hero-button"
                >
                    CONTACT
                </a>


            </div>



            <!-- =================================
                 INSTAGRAM
            ================================== -->

            <a
                href="https://www.instagram.com/company_mods/"
                target="_blank"
                rel="noopener noreferrer"
                class="instagram"
            >
                INSTAGRAM
            </a>


        </div>

    </main>


</body>
</html>
